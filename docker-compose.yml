version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: my_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: securex_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: shahdsamir19/game_backend:latest
    container_name: game_backend
    ports:
      - "5001:5001"
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy   # ✅ THIS IS THE FIX
    volumes:
      - ./src/config/service-account-key.json:/app/src/config/service-account-key.json
      - ./serviceAccountKey.json:/app/config/serviceAccountKey.json